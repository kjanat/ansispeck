name: Benchmark PR Comment
on:
  workflow_run:
    workflows: [Benchmarks]
    types: [completed]

concurrency:
  group: benchmark-comment-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted comment action
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/benchmark-comment
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Update benchmark comment
        uses: ./.github/actions/benchmark-comment
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
